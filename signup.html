<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Oma's Store</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Oma's <span>Store</span></a>
    <div style="flex:1"></div>
    <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" style="border:none; background:none; font-size:1.1rem;">🌙</button>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Join Oma's Store to start shopping</p>

    <div class="form-msg" id="su-msg"></div>

    <form id="signup-form" onsubmit="handleSignup(event)">
      <div class="field">
        <label for="su-name">Full name</label>
        <input type="text" id="su-name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="su-email">Email address</label>
        <input type="email" id="su-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="su-password">Password</label>
        <input type="password" id="su-password" placeholder="At least 4 characters" required>
      </div>
      <div class="field">
        <label for="su-security-question">Security question (for password recovery)</label>
        <select id="su-security-question" style="width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:var(--cream); color:var(--ink);" required>
          <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
          <option value="What was the name of your first pet?">What was the name of your first pet?</option>
          <option value="What city were you born in?">What city were you born in?</option>
          <option value="What is your favorite food?">What is your favorite food?</option>
        </select>
      </div>
      <div class="field">
        <label for="su-security-answer">Your answer</label>
        <input type="text" id="su-security-answer" placeholder="Answer (remember this!)" required>
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
