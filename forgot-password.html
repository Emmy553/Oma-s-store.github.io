<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Oma's Store</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Oma's <span>Store</span></a>
    <div style="flex:1"></div>
    <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" style="border:none; background:none; font-size:1.1rem;">🌙</button>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">No email gets sent — you'll answer your security question instead</p>

    <!-- Step 1: email -->
    <div id="fp-step-1">
      <div class="form-msg" id="fp-msg1"></div>
      <form onsubmit="handleForgotStep1(event)">
        <div class="field">
          <label for="fp-email">Email address</label>
          <input type="email" id="fp-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="submit-btn">Continue</button>
      </form>
    </div>

    <!-- Step 2: security question -->
    <div id="fp-step-2" style="display:none;">
      <div class="form-msg" id="fp-msg2"></div>
      <p id="fp-question-text" style="font-weight:600; margin-bottom:12px;"></p>
      <form onsubmit="handleForgotStep2(event)">
        <div class="field">
          <label for="fp-answer">Your answer</label>
          <input type="text" id="fp-answer" required>
        </div>
        <button type="submit" class="submit-btn">Verify</button>
      </form>
    </div>

    <!-- Step 3: new password -->
    <div id="fp-step-3" style="display:none;">
      <div class="form-msg" id="fp-msg3"></div>
      <form onsubmit="handleForgotStep3(event)">
        <div class="field">
          <label for="fp-new-pass">New password</label>
          <input type="password" id="fp-new-pass" placeholder="At least 4 characters" required>
        </div>
        <div class="field">
          <label for="fp-confirm-pass">Confirm new password</label>
          <input type="password" id="fp-confirm-pass" required>
        </div>
        <button type="submit" class="submit-btn">Reset Password</button>
      </form>
    </div>

    <div class="auth-switch">Remembered it? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
