<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refer Friends — Oma's Store</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Oma's <span>Store</span></a>
    <div style="flex:1"></div>
    <div class="header-actions">
      <a href="notifications.html" class="icon-btn" aria-label="Notifications" style="position:relative;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="notif-count">0</span>
      </a>
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" style="border:none; background:none; font-size:1.1rem;">🌙</button>
      <span class="account-link" id="account-label">Login</span>
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </div>
</header>

<div id="gated-content">
  <div class="profile-wrap">
    <h2 style="padding-top:20px;">Refer Friends</h2>
    <p style="color:var(--muted); font-size:0.88rem; margin-bottom:16px;">Share your code — you'll earn 200 points every time someone signs up with it.</p>

    <div class="referral-box">
      <div style="font-size:0.8rem; color:var(--muted);">Your referral code</div>
      <div class="referral-code" id="referral-code">—</div>
      <div class="referral-link-box">
        <span id="referral-link" style="flex:1;">—</span>
        <span class="link-action" onclick="copyReferralLink()">Copy</span>
      </div>
      <p style="font-size:0.8rem; margin-top:12px; color:var(--muted);">Points balance: <strong id="referral-points-balance" style="color:var(--ink);">0</strong></p>
    </div>

    <h3>Your Referrals</h3>
    <div id="referral-list"></div>
  </div>
</div>

<!-- Login-required gate -->
<div class="gate-overlay" id="gate-overlay" style="display:none;">
  <div class="gate-box">
    <h2>Welcome to Oma's Store</h2>
    <p>Please log in to view your referral link.</p>
    <a href="login.html" class="btn-primary">Log In</a>
    <a href="signup.html" class="btn-secondary">Create Account</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
