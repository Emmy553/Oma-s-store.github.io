<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart — Oma's Store</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Oma's <span>Store</span></a>
    <div style="flex:1"></div>
    <div class="header-actions">
      <a href="notifications.html" class="icon-btn" aria-label="Notifications" style="position:relative;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="notif-count">0</span>
      </a>
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" style="border:none; background:none; font-size:1.1rem;">🌙</button>
      <span class="account-link" id="account-label">Login</span>
      <a href="wishlist.html" class="icon-btn" aria-label="Wishlist">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span class="wishlist-count">0</span>
      </a>
      <a href="cart.html" class="icon-btn" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-count">0</span>
      </a>
    </div>
  </div>
</header>

<div id="gated-content">
  <div class="cart-wrap">
    <h2 style="padding-top:20px;">My Cart</h2>
    <div id="cart-items"></div>

    <div class="coupon-box">
      <div class="form-msg" id="coupon-msg"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="coupon-input" placeholder="Enter coupon code" style="flex:1;">
        <button class="price-apply" id="coupon-apply-btn" onclick="applyCoupon()">Apply</button>
      </div>
      <div id="coupon-applied" style="display:none; align-items:center; justify-content:space-between; background:#E1F0E7; border-radius:8px; padding:8px 12px; font-size:0.85rem;">
        <span>Coupon <strong class="coupon-code-label"></strong> applied</span>
        <span class="link-action remove" onclick="removeCoupon()">Remove</span>
      </div>
    </div>

    <div id="points-box" style="display:none;">
      <div class="form-msg" id="points-msg"></div>
      <div id="points-input-row" style="display:flex; flex-direction:column; gap:8px;">
        <span id="points-balance-label" style="font-size:0.82rem; color:var(--muted);">You have 0 points</span>
        <div style="display:flex; gap:8px;">
          <input type="number" id="points-redeem-input" placeholder="Points to use (x100)" style="flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--cream); color:var(--ink);">
          <button class="price-apply" onclick="applyPointsRedeem()">Apply</button>
        </div>
      </div>
      <div id="points-redeemed-row" style="display:none; align-items:center; justify-content:space-between; background:#E1F0E7; border-radius:8px; padding:8px 12px; font-size:0.85rem;">
        <span id="points-redeemed-label"></span>
        <span class="link-action remove" onclick="removePointsRedeem()">Remove</span>
      </div>
    </div>
    <p id="points-earn-preview" style="font-size:0.78rem; color:var(--muted); margin-top:6px;"></p>

    <div class="checkout-block" id="checkout-address"></div>
    <div class="checkout-block" id="checkout-payment"></div>
    <p class="checkout-warning" id="checkout-warn"></p>

    <div class="cart-summary" id="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span id="sum-subtotal">₦0</span></div>
      <div class="summary-row" id="sum-discount-row" style="display:none;"><span>Discount</span><span id="sum-discount">₦0</span></div>
      <div class="summary-row"><span>Delivery</span><span id="sum-shipping">₦0</span></div>
      <div class="summary-row total"><span>Total</span><span id="sum-total">₦0</span></div>
      <button class="btn-primary" data-i18n="checkout" style="width:100%; border:none; margin-top:10px;" onclick="handleCheckout()">Checkout</button>
    </div>
  </div>
</div>

<!-- Login-required gate -->
<div class="gate-overlay" id="gate-overlay" style="display:none;">
  <div class="gate-box">
    <h2>Welcome to Oma's Store</h2>
    <p>Please log in or create an account to view your cart.</p>
    <a href="login.html" class="btn-primary">Log In</a>
    <a href="signup.html" class="btn-secondary">Create Account</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
